spring.application.name=t2vr

# Conexión a la base de datos (puerto 3306 mapeado desde Docker)
spring.datasource.url=jdbc:mysql://localhost:3306/t2vr?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto del servidor Spring Boot
server.port=8080



